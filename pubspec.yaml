name: rubik_app
description: "iOS 魔方 App：3D 自由玩、填色求解、计时统计。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Vendored fork of puzzle_cube 0.2.1 (MIT): same model/gestures, with a
  # lit, rounded renderer instead of flat DiTreDi faces. See packages/.
  puzzle_cube:
    path: packages/puzzle_cube
  cuber: ^0.4.0
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  vector_math: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
